name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            mlx: "mlx[cpu]"
          - os: macos-14
            mlx: "mlx"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install "${{ matrix.mlx }}" -e ".[test]"
      - name: Test
        run: pytest -q
